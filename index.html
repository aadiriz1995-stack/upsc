<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track2Crack OS</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="sidebar">

<h1>🎯 Track2Crack</h1>

<ul>

<li>🏠 Mission Control</li>

<li>📚 Lectures</li>

<li>🧠 Topics</li>

<li>🔁 Revision</li>

<li>📝 Notes</li>

<li>🤖 AI Mentor</li>

<li>📰 Current Affairs</li>

<li>📅 Planner</li>

<li>📊 Analytics</li>

<li>🏆 Profile</li>

</ul>

</div>


<div class="main">

<div class="hero">

<h2>MISSION 150</h2>

<div id="countdown">
Loading...
</div>

<div class="progressbar">

<div class="fill" id="missionfill"></div>

</div>

</div>


<div class="cards">

<div class="card">

<h3>🔥 Mission Streak</h3>

<p id="streak">0 Days</p>

</div>

<div class="card">

<h3>⭐ XP</h3>

<p id="xp">0</p>

</div>

<div class="card">

<h3>📚 Lectures Today</h3>

<p>0 / 2</p>

</div>

<div class="card">

<h3>🎯 Mission Score</h3>

<p>0%</p>

</div>

</div>


<div class="mission">

<h2>Today's Mission</h2>

<label><input type="checkbox"> Revision</label><br>

<label><input type="checkbox"> MCQs</label><br>

<label><input type="checkbox"> Answer Writing</label><br>

<label><input type="checkbox"> Lecture 1</label><br>

<label><input type="checkbox"> Lecture 2</label><br>

</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
