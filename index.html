<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPSC Command Center</title>

<style>

body{
margin:0;
font-family:Segoe UI,Arial,sans-serif;
background:#111827;
color:white;
}

#topbar{
background:#0f172a;
padding:30px;
text-align:center;
box-shadow:0 2px 10px rgba(0,0,0,.4);
}

#title{
font-size:42px;
font-weight:bold;
letter-spacing:2px;
}

#days{
font-size:70px;
font-weight:bold;
margin-top:15px;
color:#38bdf8;
}

#target{
font-size:22px;
margin-top:10px;
color:#cbd5e1;
}

.container{
width:90%;
max-width:1200px;
margin:40px auto;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{

background:#1e293b;
padding:25px;
border-radius:15px;
font-size:26px;
min-height:140px;
transition:.3s;

}

.card:hover{

transform:translateY(-5px);

}

.footer{

text-align:center;
padding:30px;
color:#94a3b8;

}

</style>

</head>

<body>

<div id="topbar">

<div id="title">
🎯 UPSC COMMAND CENTER
</div>

<div id="days">
Loading...
</div>

<div id="target">
Target: 23 May 2027
</div>

</div>

<div class="container">

<div class="card">
📰 Current Affairs
</div>

<div class="card">
📚 Today's Focus
</div>

<div class="card">
🔁 Revision
</div>

<div class="card">
✍️ Answer Writing
</div>

</div>

<div class="footer">

Every day matters.

</div>

<script>

const exam=new Date("2027-05-23");

const today=new Date();

today.setHours(0,0,0,0);

exam.setHours(0,0,0,0);

const diff=exam-today;

const days=Math.ceil(diff/(1000*60*60*24));

document.getElementById("days").innerHTML="⏳ "+days+" DAYS LEFT";

</script>

</body>

</html>
