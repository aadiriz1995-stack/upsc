<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Track2Crack Mission Control</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="side">
    <div class="brand">
      <span class="logo">🎯</span>
      <div>
        <h2>Track2Crack</h2>
        <p>Mission 150 UPSC control room</p>
      </div>
    </div>

    <nav class="side-menu" aria-label="Main menu">
      <a href="#dashboard" data-route="dashboard">Mission Control</a>
      <a href="#lectures" data-route="lectures">Lectures</a>
      <a href="#planner" data-route="planner">Planner</a>
      <a href="#current-affairs" data-route="current-affairs">Current Affairs</a>
      <a href="#revisions" data-route="revisions">Revision Engine</a>
      <a href="#ai-mentor" data-route="ai-mentor">AI Mentor</a>
      <a href="#analytics" data-route="analytics">Analytics</a>
      <a href="#settings" data-route="settings">Settings</a>
    </nav>

    <div id="firebaseStatus" class="cloud-status">Cloud: not signed in</div>

    <div class="side-actions">
      <button id="exportDataBtn" type="button" class="secondary">Export Data</button>
      <label class="import-btn secondary" for="importDataInput">Import Data</label>
      <input id="importDataInput" type="file" accept="application/json" hidden>
    </div>
  </aside>

  <main>
    <header class="hero">
      <div>
        <p id="todayLabel" class="eyebrow"></p>
        <h1 id="pageTitle">Mission Control</h1>
        <p id="pageSummary" class="summary"></p>
      </div>
      <div class="progress-card" aria-live="polite">
        <strong id="dailyPercent">0%</strong>
        <span id="dailyText">0 of 0 tasks complete today</span>
        <div class="progress-bar" aria-hidden="true"><span id="dailyFill"></span></div>
      </div>
    </header>

    <div id="app" aria-live="polite"></div>
  </main>

  <div id="modalRoot" class="modal-root" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/storage.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/gamification.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="js/firebase-sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
